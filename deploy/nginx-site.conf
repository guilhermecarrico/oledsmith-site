# nginx DENTRO do container: só serve os arquivos de docs/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /privacidade funciona com e sem .html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Cache: HTML curto (muda a cada publicação), CSS/JS um dia.
    location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=86400"; }
    location ~* \.html$    { add_header Cache-Control "public, max-age=600"; }

    # Nunca servir o que não é site
    location ~ /\. { deny all; }
}
